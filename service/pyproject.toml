[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronboard-service"
version = "1.0.2"
description = "Session D-Bus service that lets the Cronboard GNOME Shell extension read and change your crontab"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
dependencies = ["dbus-fast>=2"]

[project.urls]
Homepage = "https://github.com/seniru-dilmith/cronboard"

[project.scripts]
cronboard-service = "cronboard_service.__main__:main"

[tool.setuptools]
packages = ["cronboard_service"]
