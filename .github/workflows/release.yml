name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bump package version
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/^version = .*/version = \"$VERSION\"/" service/pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: npm run build
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const f = "dist/metadata.json";
            const m = JSON.parse(require("fs").readFileSync(f));
            m["version-name"] = process.env.VERSION;
            require("fs").writeFileSync(f, JSON.stringify(m, null, 2) + "\n");
          '
          cd dist && zip -r "../cronboard@seniru-dilmith.github.io.shell-extension.zip" .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" ./*.shell-extension.zip \
            --title "v$VERSION" --generate-notes --target "$(git rev-parse HEAD)"

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build service
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: service/dist
